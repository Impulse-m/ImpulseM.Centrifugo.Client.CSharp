name: Test

on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    # Prevent duplicate builds on internal PRs: a PR from this repository runs as the push.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        dotnet-version: ['10.0.x']

    steps:
    - uses: actions/checkout@v6

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ matrix.dotnet-version }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Run Unit Tests
      if: matrix.os != 'ubuntu-latest'
      run: dotnet test --no-build --configuration Release --verbosity normal --filter "FullyQualifiedName!~IntegrationTests"

    - name: Start Centrifugo
      if: matrix.os == 'ubuntu-latest'
      run: docker compose up -d --wait

    - name: Run All Tests (Unit + Integration)
      if: matrix.os == 'ubuntu-latest'
      run: dotnet test --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage"

    - name: Stop Centrifugo
      if: matrix.os == 'ubuntu-latest' && always()
      run: docker compose down
